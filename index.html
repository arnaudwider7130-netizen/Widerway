<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="WiderWay, plateforme gratuite d'éducation et de recherche scientifique pour l'Afrique et le monde.">
<title>WiderWay | Le savoir ouvre toutes les voies</title>

<style>
:root{
--primary:#075c46;
--secondary:#0b8060;
--light:#eaf5f0;
--dark:#172b25;
--muted:#687b73;
--white:#fff;
--bg:#f5f8f6;
--border:#dce8e1;
}
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:var(--bg);
color:var(--dark);
line-height:1.6
}
header{
background:var(--primary);
color:white;
padding:18px 5%;
display:flex;
align-items:center;
justify-content:space-between;
flex-wrap:wrap;
gap:15px
}
.logo{font-size:27px;font-weight:bold}
.logo span{color:#a9e5c9}
nav{display:flex;gap:8px;flex-wrap:wrap}
nav button{
background:transparent;
color:white;
border:1px solid #ffffff55;
padding:9px 13px;
border-radius:7px;
cursor:pointer
}
nav button:hover{background:#ffffff22}
main{
max-width:1150px;
margin:auto;
padding:25px 5%;
min-height:65vh
}
.hero{
background:linear-gradient(135deg,#075c46,#0b8060);
color:white;
padding:55px 25px;
border-radius:15px;
text-align:center
}
.hero h1{font-size:36px;margin:0 0 12px}
.hero p{font-size:17px;max-width:650px;margin:10px auto}
.btn{
background:#fff;
color:var(--primary);
border:0;
padding:12px 20px;
border-radius:7px;
font-weight:bold;
cursor:pointer;
margin-top:15px
}
.section-title{color:var(--primary);margin-top:35px}
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
gap:15px;
margin-top:20px
}
.card{
background:white;
border:1px solid var(--border);
padding:20px;
border-radius:11px;
cursor:pointer;
transition:.2s
}
.card:hover{
border-color:var(--secondary);
transform:translateY(-3px);
box-shadow:0 5px 15px #0000000d
}
.card h3{color:var(--primary);margin-top:0}
.card p{color:var(--muted);font-size:14px}
.card button{
background:var(--primary);
color:white;
border:0;
padding:9px 13px;
border-radius:6px;
cursor:pointer
}
.breadcrumb{color:var(--muted);font-size:14px;margin-bottom:12px}
.page-tools{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 18px}
.page-tools button{
border:1px solid var(--border);
background:white;
color:var(--primary);
padding:9px 14px;
border-radius:7px;
font-weight:bold;
cursor:pointer
}
.page-tools button:hover{background:var(--light)}
.panel{
background:white;
border:1px solid var(--border);
border-radius:12px;
padding:22px;
margin-top:20px
}
.panel h3,.lesson h3{color:var(--primary)}
.lesson{
background:white;
border:1px solid var(--border);
border-radius:12px;
padding:22px;
margin:18px 0
}
.lesson h3{margin-top:0}
.lesson h4{color:var(--secondary);margin-bottom:5px}
.lesson p{margin-top:6px}
.lesson li{margin:7px 0}
.formula{
background:var(--light);
border-left:4px solid var(--secondary);
padding:12px 15px;
margin:12px 0;
border-radius:5px;
font-weight:bold;
overflow-wrap:anywhere
}
.example{
background:#f8faf9;
border:1px solid var(--border);
padding:14px;
border-radius:8px;
margin:12px 0
}
.answer{
background:#eef7f1;
border-radius:7px;
padding:12px;
margin-top:10px
}
input,textarea{
width:100%;
padding:13px;
border:1px solid var(--border);
border-radius:7px;
font-size:15px;
margin:8px 0 15px
}
.action{
background:var(--primary);
color:white;
padding:10px 15px;
border:0;
border-radius:7px;
cursor:pointer
}
.secondary{background:var(--light);color:var(--primary)}
.resource{
background:white;
padding:16px;
border:1px solid var(--border);
border-radius:8px;
margin:10px 0
}
.quiz-question{
background:white;
border:1px solid var(--border);
border-radius:10px;
padding:16px;
margin:15px 0
}
.quiz-question label{
display:block;
padding:7px;
cursor:pointer
}
.quiz-question input{
width:auto;
margin:0 8px 0 0
}
#quizResult{
padding:15px;
border-radius:8px;
margin-top:15px;
font-weight:bold
}
footer{
background:#123b30;
color:white;
padding:30px 5%;
text-align:center;
margin-top:40px
}
footer p{margin:5px}
.small{font-size:13px;color:var(--muted)}
footer .small{color:#c4d8cf}
@media(max-width:600px){
.hero h1{font-size:27px}
header{justify-content:center;text-align:center}
nav{justify-content:center}
.page-tools{justify-content:center}
.lesson,.panel{padding:16px}
}
</style>
</head>

<body>

/* 2. VARIABLES ET HISTORIQUE */

let selectedCountry="Burkina Faso";
let selectedUniversity="Université Joseph Ki-Zerbo";
let selectedField="";
let selectedLevel="";
let selectedPath="";
let selectedSemester="";
let selectedSubject="";

const app=document.getElementById("app");
let pageHistory=[];

function savePage(){
pageHistory.push({
html:app.innerHTML,
country:selectedCountry,
university:selectedUniversity,
field:selectedField,
level:selectedLevel,
path:selectedPath,
semester:selectedSemester,
subject:selectedSubject
});
if(pageHistory.length>40)pageHistory.shift();
}

function restorePage(){
const previous=pageHistory.pop();
if(!previous){home();return;}
app.innerHTML=previous.html;
selectedCountry=previous.country;
selectedUniversity=previous.university;
selectedField=previous.field;
selectedLevel=previous.level;
selectedPath=previous.path;
selectedSemester=previous.semester;
selectedSubject=previous.subject;
window.scrollTo({top:0,behavior:"smooth"});
}

function goBack(){
if(pageHistory.length){
history.back();
}else{
goHome();
}
}

function goHome(){
pageHistory=[];
home();
window.scrollTo({top:0,behavior:"smooth"});
}

/* 3. OUTILS D'AFFICHAGE */

function escapeHTML(value){
return String(value).replace(/[&<>"']/g,char=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
})[char]);
}

function pageTools(){
return `
<div class="page-tools">
<button type="button" data-action="back">← Retour</button>
<button type="button" data-action="home">⌂ Accueil</button>
</div>`;
}

function show(title,html,breadcrumb="WiderWay"){
app.innerHTML=pageTools()+`
<div class="breadcrumb">${escapeHTML(breadcrumb)}</div>
<h2 class="section-title">${escapeHTML(title)}</h2>
${html}`;
window.scrollTo({top:0,behavior:"smooth"});
}

function makeCard(title,description,action,value){
return `
<div class="card" data-action="${action}" data-value="${escapeHTML(value)}">
<h3>${escapeHTML(title)}</h3>
<p>${escapeHTML(description)}</p>
<button type="button">Consulter</button>
</div>`;
}

Explorer les formations

</section>

/* 5. FORMATIONS */

function formations(){
const html=`
<div class="grid">
${makeCard("Burkina Faso","Explorer les formations disponibles au Burkina Faso.","country","Burkina Faso")}
${makeCard("Autres pays africains","Espace destiné aux futures universités africaines.","coming","Afrique")}
${makeCard("International","Espace destiné aux formations internationales.","coming","International")}

show("Explorer les formations",html);
}

function country(value){
selectedCountry=value;
const universities=database[value];

if(!universities){
show("Bientôt disponible","<p>Les formations de cette région seront ajoutées progressivement.</p>");
return;
}

let html='<div class="grid">';
Object.keys(universities).forEach(university=>{
html+=makeCard(university,"Consulter les filières disponibles.","university",university);
});
html+='</div>';

show(value,html,"Formations → "+value);
}

function university(value){
selectedUniversity=value;
const fields=database[selectedCountry][value];

let html='<div class="grid">';
Object.keys(fields).forEach(field=>{
html+=makeCard(field,"Explorer les niveaux et les matières.","field",field);
});
html+='</div>';

show(value,html,selectedCountry+" → "+value);
}

/* 6. FILIÈRES ET NIVEAUX */

function field(value){
selectedField=value;
const data=database[selectedCountry][selectedUniversity][value];

let html='<div class="grid">';
Object.keys(data).forEach(level=>{
html+=makeCard(level,"Consulter les semestres de ce niveau.","level",level);
});
html+='</div>';

show(value,html,selectedUniversity+" → "+value);
}

function level(value){
selectedLevel=value;
selectedPath="";

const data=database[selectedCountry][selectedUniversity][selectedField][value];

let html='<div class="grid">';

Object.keys(data).forEach(item=>{
if(value==="L3"){
html+=makeCard(item,"Consulter les semestres de ce parcours.","path",item);
}else{
html+=makeCard(item,"Voir les matières de ce semestre.","semester",item);
}
});

html+='</div>';

show(value,html,selectedField+" → "+value);
}

/* 7. PARCOURS L3 */

function path(value){
selectedPath=value;

const data=database[selectedCountry][selectedUniversity]
[selectedField][selectedLevel][selectedPath];

let html='<div class="grid">';

Object.keys(data).forEach(semester=>{
html+=makeCard(semester,"Voir les matières du semestre.","semester",semester);
});

html+='</div>';

show(value,html,selectedField+" → L3 → "+value);
}

/* 8. MATIÈRES */

function semester(value){
selectedSemester=value;

const levelData=database[selectedCountry][selectedUniversity]
[selectedField][selectedLevel];

const data=selectedLevel==="L3"
?levelData[selectedPath][value]
:levelData[value];

let html='<div class="grid">';

data.forEach(subject=>{
html+=makeCard(subject,"Accéder aux ressources de cette matière.","subject",subject);
});

html+='</div>';

show(value,html,selectedField+" → "+selectedLevel+" → "+value);
}

const mathLessons=[
{
title:"Leçon 1 — Les ensembles de nombres",
content:`
<h4>1. Définition d'un ensemble</h4>
<p>Un ensemble est un regroupement d'éléments. En mathématiques, on utilise des lettres pour désigner les ensembles et des symboles pour indiquer l'appartenance.</p>
<div class="formula">x ∈ A : x appartient à A<br>x ∉ A : x n'appartient pas à A</div>

<h4>2. Les principaux ensembles de nombres</h4>
<ul>
<li><strong>ℕ :</strong> les entiers naturels : 0, 1, 2, 3, 4…</li>
<li><strong>ℤ :</strong> les entiers relatifs : … -3, -2, -1, 0, 1, 2, 3…</li>
<li><strong>ℚ :</strong> les nombres rationnels, qui peuvent s'écrire sous la forme a/b avec a et b entiers et b différent de 0.</li>
<li><strong>ℝ :</strong> les nombres réels, qui regroupent les nombres rationnels et irrationnels.</li>
<li><strong>ℂ :</strong> les nombres complexes, de la forme a + ib.</li>
</ul>
<div class="formula">ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ ⊂ ℂ</div>

<h4>3. Nombres rationnels et irrationnels</h4>
<p>Un nombre rationnel peut être écrit comme une fraction. Par exemple : 1/2, -3/4 et 5.</p>
<p>Un nombre irrationnel ne peut pas s'écrire comme une fraction de deux entiers. Exemples : √2 et π.</p>

<h4>4. Méthode d'apprentissage</h4>
<ul>
<li>Mémoriser les symboles des ensembles.</li>
<li>Classer plusieurs nombres dans leurs ensembles.</li>
<li>Retenir que chaque entier naturel est aussi un entier relatif.</li>
</ul>

<div class="example">
<strong>Exemple corrigé</strong>
<p>Classer les nombres suivants : -5 ; 0 ; 3/4 ; √2.</p>
<div class="answer">
-5 appartient à ℤ, ℚ et ℝ.<br>
0 appartient à ℕ, ℤ, ℚ et ℝ.<br>
3/4 appartient à ℚ et ℝ.<br>
√2 appartient à ℝ mais pas à ℚ.
</div>
</div>

<h4>5. Exercices d'application</h4>
<p><strong>Exercice 1 :</strong> Donner le plus petit ensemble auquel appartient chacun des nombres : 7 ; -4 ; 2/3 ; √5.</p>
<div class="answer">
<strong>Correction :</strong><br>
7 ∈ ℕ ; -4 ∈ ℤ ; 2/3 ∈ ℚ ; √5 ∈ ℝ et est irrationnel.
</div>
`

<p>Sur les nombres réels, on utilise l'addition, la soustraction, la multiplication et la division.</p>
<div class="formula">Addition : a + b<br>Soustraction : a - b<br>Multiplication : a × b<br>Division : a / b, avec b ≠ 0</div>

<h4>2. Règles des signes</h4>
<ul>
<li>Plus par plus donne plus.</li>
<li>Moins par moins donne plus.</li>
<li>Plus par moins donne moins.</li>
<li>Moins par plus donne moins.</li>
</ul>
<div class="formula">(+ ) × (+ ) = (+ )<br>(- ) × (- ) = (+ )<br>(+ ) × (- ) = (- )<br>(- ) × (+ ) = (- )</div>

<h4>3. Priorités opératoires</h4>
<p>Dans un calcul, on effectue généralement :</p>
<ol>
<li>Les opérations entre parenthèses.</li>

title:"Leçon 3 — Les fractions",
content:`
<h4>1. Définition</h4>
<p>Une fraction est un quotient de deux nombres entiers, avec un dénominateur non nul.</p>
<div class="formula">a/b avec b ≠ 0</div>
<p>a est le numérateur et b est le dénominateur.</p>

<h4>2. Simplification</h4>
<p>Pour simplifier une fraction, on divise le numérateur et le dénominateur par un même nombre non nul.</p>
<div class="example">
<p>12/18 = (12 ÷ 6)/(18 ÷ 6) = <strong>2/3</strong>.</p>
</div>

<h4>3. Addition et soustraction</h4>
<p>Lorsque les dénominateurs sont identiques, on additionne ou soustrait les numérateurs.</p>
<div class="formula">a/c + b/c = (a+b)/c</div>
<p>Lorsque les dénominateurs sont différents, on cherche un dénominateur commun.</p>

<h4>4. Multiplication et division</h4>
<div class="formula">a/b × c/d = (a×c)/(b×d)<br>
(a/b) ÷ (c/d) = (a/b) × (d/c)</div>

<div class="example">

<p>Calculer 1/3 + 1/6.</p>

1/3 = 2/6.<br>

</div>
</div>

<strong>Exemple corrigé 2</strong>
<p>Calculer 2/5 × 3/4.</p>

</div>
</div>

content:`
<h4>1. Définition</h4>
<p>Une puissance permet d'écrire plus simplement une multiplication répétée.</p>
<div class="formula">aⁿ = a × a × ... × a (n facteurs)</div>
<p>Exemple : 2⁴ = 2 × 2 × 2 × 2 = 16.</p>

<h4>2. Règles essentielles</h4>
<div class="formula">
aᵐ × aⁿ = aᵐ⁺ⁿ<br>
aᵐ / aⁿ = aᵐ⁻ⁿ (a ≠ 0)<br>
(aᵐ)ⁿ = aᵐˣⁿ<br>
(ab)ⁿ = aⁿbⁿ<br>
a⁰ = 1 (a ≠ 0)<br>
a⁻ⁿ = 1/aⁿ (a ≠ 0)
</div>

<h4>3. Puissances de 10</h4>
<p>Les puissances de 10 sont utiles pour écrire de très grands ou de très petits nombres.</p>
<div class="example">
<p>10³ = 1 000.</p>
<p>10⁻² = 0,01.</p>
</div>

<div class="example">
<strong>Exemple corrigé</strong>
<p>Simplifier A = 2³ × 2⁴.</p>
<div class="answer">
A = 2³⁺⁴ = 2⁷ = <strong>128</strong>.
</div>
</div>

<h4>4. Exercices</h4>
<p><strong>Exercice 1 :</strong> Calculer 3² × 3³.</p>
<div class="answer">Correction : 3⁵ = <strong>243</strong>.</div>
<p><strong>Exercice 2 :</strong> Écrire 1/5² sous forme de puissance.</p>
<div class="answer">Correction : 5⁻².</div>
`
},
{
title:"Leçon 5 — Développement et factorisation",
content:`
<h4>1. Développement</h4>
<p>Développer consiste à transformer un produit en une somme ou une différence.</p>
<div class="formula">a(b+c) = ab + ac</div>
<div class="formula">a(b-c) = ab - ac</div>

<h4>2. Factorisation</h4>
<p>Factoriser consiste à transformer une somme ou une différence en un produit.</p>
<div class="formula">ab + ac = a(b+c)</div>

<h4>3. Méthode</h4>
<ul>
<li>Repérer le facteur commun.</li>
<li>Le mettre devant une parenthèse.</li>
<li>Écrire les termes restants dans la parenthèse.</li>
</ul>

<div class="example">
<strong>Exemple corrigé : développement</strong>
<p>Développer A = 3(x + 4).</p>
<div class="answer">
A = 3 × x + 3 × 4<br>
<strong>A = 3x + 12</strong>.
</div>
</div>

<div class="example">
<strong>Exemple corrigé : factorisation</strong>
<p>Factoriser B = 5x + 15.</p>
<div class="answer">
Le facteur commun est 5.<br>
B = <strong>5(x + 3)</strong>.
</div>
</div>

<h4>4. Exercices</h4>
<p><strong>Exercice 1 :</strong> Développer 4(x + 2).</p>
<div class="answer">Correction : 4x + 8.</div>
<p><strong>Exercice 2 :</strong> Factoriser 7x + 21.</p>
<div class="answer">Correction : 7(x + 3).</div>
`
},
{
title:"Leçon 6 — Les identités remarquables",
content:`
<h4>1. Les trois identités fondamentales</h4>
<div class="formula">
(a+b)² = a² + 2ab + b²<br><br>
(a-b)² = a² - 2ab + b²<br><br>
(a+b)(a-b) = a² - b²
</div>

<h4>2. Utilisation</h4>
<p>Les identités remarquables permettent de développer et de factoriser rapidement certaines expressions.</p>

<div class="example">
<strong>Exemple corrigé 1</strong>
<p>Développer (x + 3)².</p>
<div class="answer">
Avec a = x et b = 3 :<br>
x² + 2 × x × 3 + 3²<br>
<strong>= x² + 6x + 9</strong>.
</div>
</div>

<div class="example">
<strong>Exemple corrigé 2</strong>
<p>Factoriser x² - 25.</p>
<div class="answer">
On reconnaît a² - b² avec a = x et b = 5.<br>
<strong>x² - 25 = (x - 5)(x + 5)</strong>.
</div>
</div>

<h4>3. Exercices</h4>
<p><strong>Exercice 1 :</strong> Développer (x - 2)².</p>
<div class="answer">Correction : x² - 4x + 4.</div>
<p><strong>Exercice 2 :</strong> Factoriser x² - 16.</p>
<div class="answer">Correction : (x - 4)(x + 4).</div>
`
},
{
title:"Leçon 7 — Les nombres complexes",
content:`
<h4>1. Définition</h4>
<p>Un nombre complexe est un nombre qui s'écrit sous la forme :</p>
<div class="formula">z = a + ib</div>
<p>a et b sont des nombres réels et i est le nombre imaginaire tel que :</p>
<div class="formula">i² = -1</div>
<p>a est la partie réelle et b est la partie imaginaire de z.</p>

<h4>2. Puissances de i</h4>
<div class="formula">
i¹ = i<br>
i² = -1<br>
i³ = -i<br>
i⁴ = 1
</div>
<p>Ce cycle de quatre puissances se répète.</p>

<h4>3. Addition</h4>
<p>On additionne séparément les parties réelles et les parties imaginaires.</p>
<div class="example">
<p>z₁ = 2 + 3i et z₂ = 4 - i.</p>
<div class="answer">
z₁ + z₂ = (2 + 4) + (3i - i)<br>
<strong>= 6 + 2i</strong>.
</div>
</div>

<h4>4. Multiplication</h4>
<p>On développe comme avec les expressions algébriques, puis on remplace i² par -1.</p>
<div class="example">
<p>Calculer (1 + i)(2 + i).</p>
<div class="answer">
= 2 + i + 2i + i²<br>
= 2 + 3i - 1<br>
<strong>= 1 + 3i</strong>.
</div>
</div>

<h4>5. Conjugué et module</h4>
<p>Si z = a + ib, son conjugué est :</p>
<div class="formula">z̄ = a - ib</div>
<p>Son module est :</p>
<div class="formula">|z| = √(a² + b²)</div>
<div class="example">
<p>Pour z = 3 + 4i :</p>
<div class="answer">
z̄ = 3 - 4i.<br>
|z| = √(3² + 4²) = √25 = <strong>5</strong>.
</div>
</div>

<h4>6. Représentation géométrique</h4>
<p>Un nombre complexe z = a + ib peut être représenté par le point de coordonnées (a ; b) dans le plan complexe, appelé plan d'Argand.</p>

<h4>7. Méthodes pour apprendre</h4>
<ul>
<li>Bien retenir que i² = -1.</li>
<li>S'entraîner aux calculs avec les parties réelles et imaginaires.</li>
<li>Apprendre les puissances successives de i.</li>
<li>Faire plusieurs exercices de conjugaison et de module.</li>
</ul>

<h4>8. Exercices</h4>
<p><strong>Exercice 1 :</strong> Calculer i⁶.</p>
<div class="answer">
Correction : i⁶ = i⁴ × i² = 1 × (-1) = <strong>-1</strong>.
</div>
<p><strong>Exercice 2 :</strong> Déterminer le conjugué de z = 5 - 2i.</p>
<div class="answer">Correction : z̄ = <strong>5 + 2i</strong>.</div>
<p><strong>Exercice 3 :</strong> Calculer le module de z = 6 + 8i.</p>
<div class="answer">
Correction : |z| = √(36 + 64) = √100 = <strong>10</strong>.
</div>
`
}
];

function gradeQuiz(){
let score=0;
let unanswered=0;
let details="";

quizQuestions.forEach((q,index)=>{
const selected=document.querySelector('input[name="question'+index+'"]:checked');

if(!selected){
unanswered++;
details+=`<p>Question ${index+1} : aucune réponse choisie. ${q.explanation}</p>`;
return;
}

const answer=Number(selected.value);

if(answer===q.correct){
score++;
details+=`<p>Question ${index+1} : bonne réponse. ${q.explanation}</p>`;
}else{
details+=`<p>Question ${index+1} : réponse incorrecte. ${q.explanation}</p>`;
}
});

const result=document.getElementById("quizResult");

if(!result)return;

result.style.background="#eaf5f0";
result.innerHTML=`
<h3>Ton résultat : ${score} / ${quizQuestions.length}</h3>
<p>${score>=4?"Très bon travail !":score>=3?"Bon effort ! Continue à réviser.":"Reprends les leçons et entraîne-toi encore."}</p>
<p>Questions sans réponse : ${unanswered}</p>
<hr>
${details}
`;
result.scrollIntoView({behavior:"smooth",block:"start"});
}

const query=input.value.toLowerCase().trim();

if(!query){

const matches=allSubjects().filter(subject=>

results.innerHTML=matches.map(subject=>`

}
