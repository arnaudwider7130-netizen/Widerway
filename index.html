
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WiderWay | Éducation et Recherche</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f6fa;color:#17243a}
header{background:#10264a;color:white;padding:20px}
.logo{font-size:28px;font-weight:bold;color:#f4c542}
.logo span{color:white}
nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}
nav button{background:#294c75}
.hero{background:linear-gradient(120deg,#10264a,#176b70);color:white;text-align:center;padding:45px 15px}
main{max-width:1050px;margin:auto;padding:25px 5%}
h2{color:#10264a}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px}
.card{background:white;padding:20px;border-radius:10px;box-shadow:0 3px 12px #00000010}
button{background:#176b70;color:white;border:0;border-radius:6px;padding:12px 16px;cursor:pointer;font-size:15px;margin-top:10px}
button:hover{background:#10264a}
.back{background:#64748b;margin-bottom:18px}
#breadcrumb{color:#176b70;margin:15px 0}
#content{min-height:300px}
input{padding:12px;width:100%;max-width:450px;border:1px solid #ccd4df;border-radius:6px;margin:10px 0}
footer{background:#10264a;color:white;text-align:center;padding:25px;margin-top:35px}
</style>
</head>
<body>

<header>
<div class="logo">Wider<span>Way</span></div>
<p>Le savoir ouvre toutes les voies.</p>
<nav>
<button onclick="home()">Accueil</button>
<button onclick="countries()">Formations</button>
<button onclick="library()">Bibliothèque</button>
<button onclick="research()">Recherche</button>
</nav>
</header>

<div class="hero">
<h1>Bienvenue sur WiderWay</h1>
<p>La plateforme gratuite d'éducation et de recherche scientifique.</p>
<button onclick="countries()">Explorer les formations</button>
</div>

<main>
<div id="breadcrumb">Accueil</div>
<div id="content"></div>
</main>

<footer>
<p>© 2026 WiderWay - Éducation et recherche pour tous.</p>
</footer>

<script>
const database = {
"Burkina Faso": {
"Université Joseph Ki-Zerbo": {
"Sciences de la Vie et de la Terre": {
"L1": {
"S1": ["Biologie cellulaire","Embryologie","Chimie générale","Mathématiques","Physique","Géologie générale","Statistiques"],
"S2": ["Hérédité","Matériel héréditaire","Biologie animale","Biologie végétale","Géologie","Anglais scientifique","Mathématiques et statistiques"]
},
"L2": {"S3":[],"S4":[]},
"L3": {"S5":[],"S6":[]}
},
"Sciences fondamentales": {
"L1": {"S1":["Mathématiques","Physique","Chimie"],"S2":["Mathématiques","Physique","Chimie"]},
"L2": {"S3":[],"S4":[]},
"L3": {"S5":[],"S6":[]}
}
}
}
};

let selectedCountry="";
let selectedUniversity="";
let selectedField="";
let selectedLevel="";
let selectedSemester="";

function show(title,html,path){
document.getElementById("content").innerHTML="<h2>"+title+"</h2>"+html;
document.getElementById("breadcrumb").textContent=path;
window.scrollTo(0,0);
}

function makeCard(title,description,action,label="Explorer"){
return '<div class="card"><h3>'+title+'</h3><p>'+description+'</p><button onclick="'+action+'">'+label+'</button></div>';
}

function home(){
show("Bienvenue sur WiderWay",
'<p>Une plateforme gratuite pour apprendre, partager les connaissances et encourager la recherche scientifique.</p>'+
'<div class="grid">'+
makeCard("Formations","Découvrir les universités et les filières.","countries()")+
makeCard("Bibliothèque","Rechercher les cours et documents.","library()")+
makeCard("Recherche scientifique","Découvrir les publications et projets.","research()")+
'</div>',"Accueil");
}

function countries(){
show("Choisir un pays",
'<div class="grid">'+
makeCard("🇧🇫 Burkina Faso","Explorer les formations universitaires.","universities()")+
makeCard("Autres pays africains","Bientôt disponibles.","alert(\\'Les autres pays seront ajoutés progressivement.\\')")+
makeCard("International","Formations internationales à venir.","alert(\\'Cette rubrique sera bientôt disponible.\\')")+
'</div>',"Accueil → Formations");
selectedCountry="Burkina Faso";
}

function universities(){
selectedCountry="Burkina Faso";
show("Universités du Burkina Faso",
'<div class="grid">'+
makeCard("Université Joseph Ki-Zerbo","Ouagadougou.","fields()")+
'</div>',"Burkina Faso → Universités");
}
  function fields(){
  selectedCountry = "Burkina Faso";
  selectedUniversity = "Université Joseph Ki-Zerbo";

  const html = `
    <div class="grid">
      <div class="card">
        <h3>Sciences de la Vie et de la Terre (SVT)</h3>
        <button id="btnSVT">Explorer la filière</button>
      </div>
      <div class="card">
        <h3>Sciences fondamentales</h3>
        <button id="btnSF">Explorer la filière</button>
      </div>
    </div>
  `;

  show("Filières universitaires", html, "Burkina Faso → UJKZ");

  document.getElementById("btnSVT").addEventListener("click", function(){
    levels("Sciences de la Vie et de la Terre");
  });

  document.getElementById("btnSF").addEventListener("click", function(){
    levels("Sciences fondamentales");
  });
}
function levels(field){
selectedField=field;
const data=database[selectedCountry][selectedUniversity][field];
let html='<p>Choisis ton niveau :</p><div class="grid">';
Object.keys(data).forEach(level=>{
html+=makeCard(level,"Consulter les semestres de ce niveau.","semesters("+JSON.stringify(level)+")");
});
html+='</div>';
show(field,html,"Burkina Faso → UJKZ → "+field);
}

function semesters(level){
selectedLevel=level;
const data=database[selectedCountry][selectedUniversity][selectedField][level];
let html='<p>Choisis ton semestre :</p><div class="grid">';
Object.keys(data).forEach(semester=>{
html+=makeCard(semester,"Voir les matières du semestre.","subjects("+JSON.stringify(semester)+")");
});
html+='</div>';
show(level,html,selectedField+" → "+level);
}

function subjects(semester){
selectedSemester=semester;
const list=database[selectedCountry][selectedUniversity][selectedField][selectedLevel][semester];
let html='<div class="grid">';
if(list.length===0){
html+='<div class="card"><p>Les matières de ce semestre seront ajoutées prochainement.</p></div>';
}
list.forEach(subject=>{
html+=makeCard(subject,"Cours, résumé et exercices disponibles progressivement.","resources("+JSON.stringify(subject)+")","Ouvrir la matière");
});
html+='</div>';
show(semester,html,selectedField+" → "+selectedLevel+" → "+semester);
}

function resources(subject){
show(subject,
'<div class="grid">'+
makeCard("Cours","Consulter le cours de cette matière.","placeholder(\\'Cours\\')")+
makeCard("Résumé","Retrouver les points essentiels.","placeholder(\\'Résumé\\')")+
makeCard("Exercices corrigés","S'entraîner et vérifier ses réponses.","placeholder(\\'Exercices corrigés\\')")+
makeCard("Documents PDF","Accéder aux documents pédagogiques.","placeholder(\\'Documents PDF\\')")+
'</div>',
selectedField+" → "+selectedLevel+" → "+selectedSemester+" → "+subject);
}

function placeholder(type){
show(type,"<div class='card'><p>Les ressources seront ajoutées progressivement dans WiderWay.</p></div>","Ressources");
}

function library(){
show("Bibliothèque numérique",
'<p>Recherche une matière dans la bibliothèque :</p>'+
'<input id="search" placeholder="Exemple : Biologie cellulaire" oninput="searchSubjects()">'+
'<div id="results" class="grid"></div>',
"Accueil → Bibliothèque");
}

function searchSubjects(){
const q=document.getElementById("search").value.toLowerCase();
let all=[];
Object.values(database).forEach(country=>{
Object.values(country).forEach(university=>{
Object.values(university).forEach(field=>{
Object.values(field).forEach(level=>{
Object.values(level).forEach(semester=>all=all.concat(semester));
});
});
});
});
const results=all.filter(item=>item.toLowerCase().includes(q));
document.getElementById("results").innerHTML=results.map(item=>'<div class="card">'+item+'</div>').join("") || "<p>Aucune matière trouvée.</p>";
}

function research(){
show("Recherche scientifique",
'<div class="grid">'+
'<div class="card"><h3>Publications</h3><p>Articles et travaux scientifiques.</p></div>'+
'<div class="card"><h3>Projets</h3><p>Découverte de projets de recherche.</p></div>'+
'<div class="card"><h3>Communauté</h3><p>Échanges entre étudiants et chercheurs.</p></div>'+
'</div>',"Accueil → Recherche");
}

home();
</script>
</body>
</html>
