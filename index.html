.breadcrumb{color:var(--muted);font-size:14px;margin-bottom:12px}
.page-tools{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 18px}
.page-tools button{border:1px solid var(--border);background:white;color:var(--primary);padding:9px 14px;border-radius:7px;font-weight:bold;cursor:pointer}
.panel,.lesson{background:white;border:1px solid var(--border);border-radius:12px;padding:22px;margin:18px 0}

input,textarea{width:100%;padding:13px;border:1px solid var(--border);border-radius:7px;font-size:15px;margin:8px 0 15px}
.resource,.quiz-question{background:white;border:1px solid var(--border);border-radius:9px;padding:16px;margin:12px 0}

footer{background:#123b30;color:white;padding:30px 5%;text-align:center;margin-top:40px}footer p{margin:5px}footer .small{color:#c4d8cf}

/* =========================================================
   2. ÉTAT ET OUTILS DE NAVIGATION

const app = document.getElementById("app");let selectedCountry = "Burkina Faso";
let selectedUniversity = "Université Joseph Ki-Zerbo";
let selectedField = "";
let selectedLevel = "";
let selectedPath = "";
let selectedSemester = "";
let selectedSubject = "";
let pageHistory = [];

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  })[char]);
}
function snapshot() {
  return {
    html: app.innerHTML, country:selectedCountry, university:selectedUniversity,
    field:selectedField, level:selectedLevel, path:selectedPath,
    semester:selectedSemester, subject:selectedSubject
  };
}
function savePage() {
  pageHistory.push(snapshot());
  if (pageHistory.length > 50) pageHistory.shift();
}
function restorePage() {
  const previous = pageHistory.pop();
  if (!previous) { home(); return; }
  app.innerHTML = previous.html;
  selectedCountry=previous.country; selectedUniversity=previous.university;
  selectedField=previous.field; selectedLevel=previous.level;
  selectedPath=previous.path; selectedSemester=previous.semester;
  selectedSubject=previous.subject;
  window.scrollTo({top:0,behavior:"smooth"});
}
function goHome() {
  pageHistory = [];
  selectedField=selectedLevel=selectedPath=selectedSemester=selectedSubject="";
  home();
  window.scrollTo({top:0,behavior:"smooth"});
}
function pageTools() {
  return `<div class="page-tools">
    <button type="button" data-action="back">← Retour</button>
    <button type="button" data-action="home">⌂ Accueil</button>
  </div>`;
}
function show(title, html, breadcrumb="WiderWay") {
  app.innerHTML = pageTools() +
    `<div class="breadcrumb">${escapeHTML(breadcrumb)}</div>
     <h2 class="section-title">${escapeHTML(title)}</h2>${html}`;
  window.scrollTo({top:0,behavior:"smooth"});
}
function makeCard(title, description, action, value) {
  return `<div class="card" data-action="${action}" data-value="${escapeHTML(value)}">
    <h3>${escapeHTML(title)}</h3><p>${escapeHTML(description)}</p>
    <button type="button">Consulter</button>
  </div>`;
}

function country(value) {
  selectedCountry=value;
  const universities=database[value];
  if(!universities){show("Bientôt disponible","<p>Les formations de cette région seront ajoutées progressivement.</p>");return;}
  let html='<div class="grid">';
  Object.keys(universities).forEach(name=>html+=makeCard(name,"Consulter les filières disponibles.","university",name));
  html+='</div>';
  show(value,html,"Formations → "+value);
}
function university(value) {
  selectedUniversity=value;
  const fields=database[selectedCountry][value];
  let html='<div class="grid">';
  Object.keys(fields).forEach(name=>html+=makeCard(name,"Explorer les niveaux et les matières.","field",name));
  html+='</div>';
  show(value,html,selectedCountry+" → "+value);
}
function field(value) {
  selectedField=value;
  const data=database[selectedCountry][selectedUniversity][value];
  let html='<div class="grid">';
  Object.keys(data).forEach(levelName=>html+=makeCard(levelName,"Consulter les semestres de ce niveau.","level",levelName));
  html+='</div>';
  show(value,html,selectedUniversity+" → "+value);
}
function level(value) {
  selectedLevel=value; selectedPath="";
  const data=database[selectedCountry][selectedUniversity][selectedField][value];
  let html='<div class="grid">';
  Object.keys(data).forEach(item=>{
    html+= value==="L3"
      ? makeCard(item,"Consulter les semestres de ce parcours.","path",item)
      : makeCard(item,"Voir les matières de ce semestre.","semester",item);

  html+='</div>';
  show(value,html,selectedField+" → "+value);
}
function path(value) {
  selectedPath=value;
  const data=database[selectedCountry][selectedUniversity][selectedField][selectedLevel][value];
  let html='<div class="grid">';
  Object.keys(data).forEach(sem=>html+=makeCard(sem,"Voir les matières du semestre.","semester",sem));
  html+='</div>';
  show(value,html,selectedField+" → L3 → "+value);
}
function semester(value) {
  selectedSemester=value;
  const levelData=database[selectedCountry][selectedUniversity][selectedField][selectedLevel];
  const data=selectedLevel==="L3" ? levelData[selectedPath][value] : levelData[value];
  let html='<div class="grid">';
  data.forEach(name=>html+=makeCard(name,"Accéder aux ressources de cette matière.","subject",name));
  if(selectedField==="Sciences de la Vie et de la Terre" && selectedLevel==="L1" && value==="S1"){
    html+=makeCard("Histoire approfondie de la biologie","Ressource complémentaire WiderWay — non officielle dans la maquette UJKZ.","supplementary","Histoire approfondie de la biologie");
  }
  html+='</div>';
  show(value,html,selectedField+" → "+selectedLevel+" → "+value);
}

/* =========================================================

const mathLessons = [
{title:"Leçon 1 — Les ensembles de nombres",content:`
<h4>1. Définition d'un ensemble</h4>
<p>Un ensemble est un regroupement d'éléments. En mathématiques, on utilise des lettres pour désigner les ensembles et des symboles pour indiquer l'appartenance.</p>
<div class="formula">x ∈ A : x appartient à A<br>x ∉ A : x n'appartient pas à A</div>
<h4>2. Les principaux ensembles de nombres</h4>
<ul><li><strong>ℕ :</strong> les entiers naturels : 0, 1, 2, 3, 4…</li><li><strong>ℤ :</strong> les entiers relatifs : … -3, -2, -1, 0, 1, 2, 3…</li><li><strong>ℚ :</strong> les nombres rationnels, qui peuvent s'écrire sous la forme a/b avec a et b entiers et b différent de 0.</li><li><strong>ℝ :</strong> les nombres réels, qui regroupent les nombres rationnels et irrationnels.</li><li><strong>ℂ :</strong> les nombres complexes, de la forme a + ib.</li></ul>
<div class="formula">ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ ⊂ ℂ</div>
<h4>3. Nombres rationnels et irrationnels</h4>
<p>Un nombre rationnel peut être écrit comme une fraction. Par exemple : 1/2, -3/4 et 5. Un nombre irrationnel ne peut pas s'écrire comme une fraction de deux entiers. Exemples : √2 et π.</p>
<div class="example"><strong>Exemple corrigé</strong><p>Classer : -5 ; 0 ; 3/4 ; √2.</p><div class="answer">-5 appartient à ℤ, ℚ et ℝ.<br>0 appartient à ℕ, ℤ, ℚ et ℝ.<br>3/4 appartient à ℚ et ℝ.<br>√2 appartient à ℝ mais pas à ℚ.</div></div>
<h4>4. Exercice</h4><p>Donner le plus petit ensemble auquel appartient chacun des nombres : 7 ; -4 ; 2/3 ; √5.</p><div class="answer">Correction : 7 ∈ ℕ ; -4 ∈ ℤ ; 2/3 ∈ ℚ ; √5 ∈ ℝ et est irrationnel.</div>`},
{title:"Leçon 2 — Opérations sur les nombres réels",content:`
<h4>1. Les quatre opérations</h4><p>Sur les nombres réels, on utilise l'addition, la soustraction, la multiplication et la division.</p>
<div class="formula">Addition : a + b<br>Soustraction : a - b<br>Multiplication : a × b<br>Division : a / b, avec b ≠ 0</div>
<h4>2. Règles des signes</h4><ul><li>Plus par plus donne plus.</li><li>Moins par moins donne plus.</li><li>Plus par moins donne moins.</li><li>Moins par plus donne moins.</li></ul>
<div class="formula">(+ ) × (+ ) = (+ )<br>(- ) × (- ) = (+ )<br>(+ ) × (- ) = (- )<br>(- ) × (+ ) = (- )</div>
<h4>3. Priorités opératoires</h4><ol><li>Parenthèses.</li><li>Puissances.</li><li>Multiplications et divisions.</li><li>Additions et soustractions.</li></ol>
<div class="example"><strong>Exemples corrigés</strong><p>A = 5 + 3 × 4 = 5 + 12 = <strong>17</strong>.</p><p>B = (-3) × (-4) + 2 = 12 + 2 = <strong>14</strong>.</p></div>
<h4>4. Exercices</h4><p>A = 8 - 2 × 3. Correction : <strong>2</strong>.</p><p>B = (-5) × 3 + 20. Correction : <strong>5</strong>.</p>`},
{title:"Leçon 3 — Les fractions",content:`
<h4>1. Définition</h4><p>Une fraction est un quotient de deux nombres, avec un dénominateur non nul.</p><div class="formula">a/b avec b ≠ 0</div><p>a est le numérateur et b le dénominateur.</p>
<h4>2. Simplification</h4><p>Pour simplifier une fraction, on divise le numérateur et le dénominateur par un même nombre non nul.</p><div class="example">12/18 = (12 ÷ 6)/(18 ÷ 6) = <strong>2/3</strong>.</div>
<h4>3. Addition et soustraction</h4><div class="formula">a/c + b/c = (a+b)/c</div><p>Si les dénominateurs sont différents, on cherche un dénominateur commun.</p>
<h4>4. Multiplication et division</h4><div class="formula">a/b × c/d = (a×c)/(b×d)<br>(a/b) ÷ (c/d) = (a/b) × (d/c)</div>
<div class="example"><strong>Exemples corrigés</strong><p>1/3 + 1/6 = 2/6 + 1/6 = <strong>1/2</strong>.</p><p>2/5 × 3/4 = 6/20 = <strong>3/10</strong>.</p></div>
<h4>5. Exercices</h4><p>2/3 + 1/6 = <strong>5/6</strong>.</p><p>15/25 = <strong>3/5</strong>.</p>`},
{title:"Leçon 4 — Les puissances",content:`
<h4>1. Définition</h4><p>Une puissance permet d'écrire plus simplement une multiplication répétée.</p><div class="formula">aⁿ = a × a × ... × a (n facteurs)</div><p>Exemple : 2⁴ = 16.</p>
<h4>2. Règles essentielles</h4><div class="formula">aᵐ × aⁿ = aᵐ⁺ⁿ<br>aᵐ / aⁿ = aᵐ⁻ⁿ (a ≠ 0)<br>(aᵐ)ⁿ = aᵐˣⁿ<br>(ab)ⁿ = aⁿbⁿ<br>a⁰ = 1 (a ≠ 0)<br>a⁻ⁿ = 1/aⁿ (a ≠ 0)</div>
<h4>3. Puissances de 10</h4><p>10³ = 1 000 et 10⁻² = 0,01.</p>
<div class="example"><strong>Exemple corrigé</strong><p>2³ × 2⁴ = 2⁷ = <strong>128</strong>.</p></div>
<h4>4. Exercices</h4><p>3² × 3³ = <strong>243</strong>.</p><p>1/5² = <strong>5⁻²</strong>.</p>`},{title:"Leçon 5 — Développement et factorisation",content:`
<h4>1. Développement</h4><p>Développer consiste à transformer un produit en une somme ou une différence.</p><div class="formula">a(b+c) = ab + ac<br>a(b-c) = ab - ac</div>
<h4>2. Factorisation</h4><p>Factoriser consiste à transformer une somme ou une différence en un produit.</p><div class="formula">ab + ac = a(b+c)</div>
<h4>3. Méthode</h4><ol><li>Repérer le facteur commun.</li><li>Le mettre devant une parenthèse.</li><li>Écrire les termes restants dans la parenthèse.</li></ol>
<div class="example"><strong>Exemples corrigés</strong><p>3(x + 4) = <strong>3x + 12</strong>.</p><p>5x + 15 = <strong>5(x + 3)</strong>.</p></div>
<h4>4. Exercices</h4><p>Développer 4(x + 2) : <strong>4x + 8</strong>.</p><p>Factoriser 7x + 21 : <strong>7(x + 3)</strong>.</p>`},
{title:"Leçon 6 — Les identités remarquables",content:`
<h4>1. Les trois identités fondamentales</h4><div class="formula">(a+b)² = a² + 2ab + b²<br><br>(a-b)² = a² - 2ab + b²<br><br>(a+b)(a-b) = a² - b²</div>
<h4>2. Utilisation</h4><p>Les identités remarquables permettent de développer et de factoriser rapidement certaines expressions.</p>
<div class="example"><strong>Exemples corrigés</strong><p>(x + 3)² = x² + 6x + 9.</p><p>x² - 25 = (x - 5)(x + 5).</p></div>
<h4>3. Exercices</h4><p>(x - 2)² = <strong>x² - 4x + 4</strong>.</p><p>x² - 16 = <strong>(x - 4)(x + 4)</strong>.</p>`},
{title:"Leçon 7 — Les nombres complexes",content:`
<h4>1. Définition</h4><p>Un nombre complexe s'écrit sous la forme :</p><div class="formula">z = a + ib, avec i² = -1</div><p>a est la partie réelle et b la partie imaginaire de z.</p>
<h4>2. Puissances de i</h4><div class="formula">i¹ = i<br>i² = -1<br>i³ = -i<br>i⁴ = 1</div>
<h4>3. Addition et multiplication</h4><div class="example">z₁ = 2 + 3i et z₂ = 4 - i.<p>z₁ + z₂ = <strong>6 + 2i</strong>.</p><p>(1+i)(2+i) = 2+i+2i+i² = <strong>1+3i</strong>.</p></div>
<h4>4. Conjugué et module</h4><div class="formula">Si z = a + ib, alors z̄ = a - ib et |z| = √(a²+b²).</div><div class="example">Pour z = 3 + 4i : z̄ = 3 - 4i et |z| = <strong>5</strong>.</div>
<h4>5. Exercices</h4><p>i⁶ = <strong>-1</strong>.</p><p>Le conjugué de 5 - 2i est <strong>5 + 2i</strong>.</p><p>|6 + 8i| = <strong>10</strong>.</p>`}
];

/* =========================================================
   5. CHAPITRE 2 : ÉQUATIONS ET INÉQUATIONS
   Les six leçons sont intégrées dans l'arborescence.
   Les banques détaillées déjà élaborées seront enrichies
   avec leurs textes intégraux lors de la prochaine révision.
   ========================================================= */
const chapter2Lessons = [
{
 title:"Leçon 1 — Fondements de l'égalité et équations du premier degré",
 objectives:"Comprendre les propriétés de l'égalité, transformer une équation sans changer ses solutions et résoudre une équation du premier degré.",
 content:`<h4>1. Égalité et équations</h4>
 <p>Une égalité affirme que deux expressions ont la même valeur. Une équation est une égalité qui contient une ou plusieurs inconnues.</p>
 <div class="formula">a = b ⟺ a + c = b + c</div>
 <p>On peut ajouter ou soustraire un même nombre aux deux membres d'une égalité. On peut aussi multiplier ou diviser les deux membres par un même nombre non nul.</p>
 <h4>2. Équation du premier degré</h4><div class="formula">ax + b = 0</div>
 <p>Si a ≠ 0, la solution est x = -b/a. Si a = 0 et b ≠ 0, l'équation n'a aucune solution. Si a = 0 et b = 0, tous les réels sont solutions.</p>
 <div class="example"><strong>Exemple corrigé</strong><p>Résoudre 3x - 12 = 0.</p><div class="answer">3x = 12, donc x = 12/3 = <strong>4</strong>. Vérification : 3 × 4 - 12 = 0.</div></div>
 <h4>3. Méthode générale</h4><ol><li>Regrouper les termes contenant x.</li><li>Regrouper les constantes dans l'autre membre.</li><li>Réduire chaque membre.</li><li>Diviser par le coefficient de x s'il est non nul.</li><li>Vérifier la solution dans l'équation initiale.</li></ol>
 <h4>4. Erreurs à éviter</h4><ul><li>Changer un terme de membre sans changer son signe.</li><li>Diviser par zéro.</li><li>Oublier de vérifier le résultat.</li></ul>`,
 exercises:"Exercices à traiter : résoudre 5x - 15 = 0 ; 2x + 7 = 19 ; 4(x - 2) = 12 ; 3x + 2 = x + 10 ; discuter les solutions de (m - 2)x = 6."
},
{
 title:"Leçon 2 — Équations avec parenthèses, fractions et paramètres",
 objectives:"Maîtriser la distributivité, les dénominateurs communs, les restrictions de domaine et les discussions suivant les paramètres.",
 content:`<h4>1. Équations avec parenthèses</h4><p>On commence par développer en appliquant la distributivité, puis on réduit les termes semblables.</p><div class="formula">a(b+c) = ab + ac</div>
 <h4>2. Équations avec fractions</h4><p>On identifie les dénominateurs, on détermine les valeurs interdites, puis on multiplie les deux membres par un dénominateur commun non nul.</p>
 <div class="example"><strong>Exemple corrigé</strong><p>Résoudre x/2 + x/3 = 5.</p><div class="answer">Le dénominateur commun est 6 : 3x + 2x = 30, donc 5x = 30 et <strong>x = 6</strong>.</div></div>
 <h4>3. Équations avec paramètre</h4><div class="example"><p>Résoudre (m - 2)x = 6.</p><div class="answer">Si m ≠ 2, x = 6/(m - 2). Si m = 2, on obtient 0x = 6 : il n'y a aucune solution.</div></div>
 <h4>4. Précautions</h4><ul><li>Indiquer les valeurs interdites avant de multiplier par des expressions contenant x.</li><li>Étudier séparément les cas où un coefficient devient nul.</li><li>Vérifier les solutions dans l'équation de départ.</li></ul>`,
 exercises:"Exercices à traiter : 3(2x - 5) = 9 ; x/2 + x/3 = 10 ; (x - 1)/3 = (x + 2)/5 ; (m - 2)x = 6 ; discuter une équation comportant deux paramètres."
},
{
 title:"Leçon 3 — Équations produit nul et factorisation",
 objectives:"Utiliser la propriété du produit nul et différentes techniques de factorisation pour résoudre des équations.",
 content:`<h4>1. Propriété du produit nul</h4><div class="formula">A(x) × B(x) = 0 ⟺ A(x) = 0 ou B(x) = 0</div>
 <p>Un produit de facteurs réels est nul si et seulement si au moins l'un de ses facteurs est nul.</p>
 <h4>2. Techniques de factorisation</h4><ul><li>Mise en évidence d'un facteur commun.</li><li>Identités remarquables.</li><li>Regroupement de termes.</li><li>Factorisation d'un trinôme lorsque cela est possible.</li></ul>
 <div class="example"><strong>Exemple corrigé</strong><p>Résoudre (x - 3)(2x + 4) = 0.</p><div class="answer">x - 3 = 0 ou 2x + 4 = 0. Ainsi <strong>x = 3 ou x = -2</strong>.</div></div>
 <h4>3. Méthode</h4><ol><li>Tout ramener dans un même membre.</li><li>Factoriser complètement.</li><li>Appliquer la propriété du produit nul.</li><li>Résoudre chaque équation obtenue.</li></ol>`,
 exercises:"Exercices à traiter : x(x - 5) = 0 ; (2x + 1)(x - 4) = 0 ; x² - 9 = 0 ; x² + 5x + 6 = 0 ; factoriser puis résoudre une équation polynomiale de degré supérieur."
},
{
 title:"Leçon 4 — Équations du second degré",
 objectives:"Calculer le discriminant, déterminer les racines réelles, factoriser un trinôme et utiliser les relations entre racines et coefficients.",
 content:`<h4>1. Forme générale</h4><div class="formula">ax² + bx + c = 0, avec a ≠ 0</div>
 <h4>2. Discriminant</h4><div class="formula">Δ = b² - 4ac</div>
 <ul><li>Si Δ &gt; 0 : deux racines réelles distinctes.</li><li>Si Δ = 0 : une racine réelle double.</li><li>Si Δ &lt; 0 : aucune racine réelle.</li></ul>
 <div class="formula">Si Δ ≥ 0 : x₁ = (-b - √Δ)/(2a) et x₂ = (-b + √Δ)/(2a)</div>
 <div class="example"><strong>Exemple corrigé</strong><p>Résoudre x² - 5x + 6 = 0.</p><div class="answer">Δ = 25 - 24 = 1. Les racines sont (5 - 1)/2 = 2 et (5 + 1)/2 = 3. Donc <strong>S = {2 ; 3}</strong>.</div></div>
 <h4>3. Relations de Viète</h4><div class="formula">x₁ + x₂ = -b/a ; x₁x₂ = c/a</div>
 <h4>4. Forme canonique</h4><p>La forme canonique permet d'étudier le sommet et les variations de la parabole associée au trinôme.</p>`,
 exercises:"Exercices à traiter : x² - 7x + 12 = 0 ; 2x² - 8x + 8 = 0 ; x² + 2x + 5 = 0 dans ℝ ; factoriser 2x² - 10x + 12 ; résoudre un problème géométrique ramené à un trinôme."
},
{
 title:"Leçon 5 — Inéquations du premier et du second degré",
 objectives:"Résoudre des inéquations, construire des tableaux de signes et déterminer des intersections d'ensembles de solutions.",
 content:`<h4>1. Règles fondamentales</h4><p>Ajouter ou soustraire un même nombre conserve le sens de l'inégalité. Multiplier ou diviser par un nombre négatif inverse le sens de l'inégalité.</p>
 <div class="formula">Si a &lt; b et k &lt; 0, alors ka &gt; kb.</div>
 <h4>2. Inéquation du premier degré</h4><div class="example"><strong>Exemple corrigé</strong><p>Résoudre -2x + 6 ≤ 12.</p><div class="answer">-2x ≤ 6. En divisant par -2, on inverse le sens : <strong>x ≥ -3</strong>.</div></div>
 <h4>3. Signe d'un trinôme</h4><p>Pour un trinôme ayant deux racines réelles distinctes, son signe est celui de a à l'extérieur des racines et le signe opposé entre les racines.</p>
 <h4>4. Inéquations produit et quotient</h4><p>On factorise le numérateur et le dénominateur, on repère les zéros et les valeurs interdites, puis on construit un tableau de signes.</p>
 <h4>5. Systèmes d'inéquations</h4><p>La solution d'un système est l'intersection des ensembles de solutions de chaque inéquation.</p>`,
 exercises:"Exercices à traiter : 3x - 4 &gt; 8 ; -2x + 6 ≤ 12 ; 2x² - 8x + 6 ≥ 0 ; (x² - 4)/(x - 1) ≥ 0 ; résoudre un système d'inéquations."
},
{
 title:"Leçon 6 — Systèmes d'équations et d'inéquations",
 objectives:"Résoudre des systèmes par substitution, élimination et déterminants, interpréter graphiquement les solutions et étudier des contraintes.",
 content:`<h4>1. Définition</h4><p>Un système regroupe plusieurs équations dont les inconnues doivent satisfaire simultanément toutes les relations.</p>
 <h4>2. Méthodes de résolution</h4><ul><li>Substitution : exprimer une inconnue en fonction de l'autre.</li><li>Élimination : combiner les équations pour supprimer une inconnue.</li><li>Comparaison : isoler une même inconnue dans deux équations.</li><li>Déterminants : appliquer la règle de Cramer lorsque le déterminant est non nul.</li></ul>
 <div class="formula">Pour ax + by = e et cx + dy = f : D = ad - bc.</div>
 <div class="example"><strong>Exemple corrigé par élimination</strong><p>Résoudre x + y = 9 et x - y = 3.</p><div class="answer">En additionnant : 2x = 12, donc x = 6. Puis y = 3. Solution : <strong>(6 ; 3)</strong>.</div></div>
 <h4>3. Interprétation graphique</h4><p>Deux droites sécantes donnent une solution unique ; deux droites parallèles distinctes n'en donnent aucune ; deux droites confondues donnent une infinité de solutions.</p>
 <h4>4. Systèmes d'inéquations</h4><p>Dans le plan, chaque inéquation définit un demi-plan. La solution du système est leur intersection. La frontière est pleine pour ≤ ou ≥, et discontinue pour &lt; ou &gt;.</p>
 <h4>5. Applications</h4><p>Les systèmes servent notamment à résoudre des problèmes de mélanges, de production, de budgets et de bilans scientifiques.</p>`,
 exercises:"Exercices à traiter : x + y = 9 et x - y = 3 ; 2x + y = 8 et x + y = 5 ; 2x + 3y = 17 et 4x - y = 5 ; étudier un système dépendant d'un paramètre ; représenter un système d'inéquations dans le plan."
}
];

function gradeQuiz() {
  let score=0,details="",unanswered=0;
  quizQuestions.forEach((q,i)=>{
    const selected=document.querySelector(`input[name="q${i}"]:checked`);
    if(!selected){unanswered++;details+=`<p>Question ${i+1} : sans réponse. ${q.explanation}</p>`;return;}
    if(Number(selected.value)===q.correct){score++;details+=`<p>Question ${i+1} : bonne réponse. ${q.explanation}</p>`;}
    else details+=`<p>Question ${i+1} : réponse incorrecte. ${q.explanation}</p>`;
  });
  const result=document.getElementById("quizResult");
  if(result){result.className="panel";result.innerHTML=`<h3>Résultat : ${score} / ${quizQuestions.length}</h3><p>Questions sans réponse : ${unanswered}</p>${details}`;result.scrollIntoView({behavior:"smooth"});}
}

actions.gradeWiderwayQuiz2 = function() {
  const form = document.getElementById("widerwayQuiz2");

  if (!form || !result) return;

  let score = 0;
  let corrections = "";

  widerwayQuiz2Questions.forEach((question, i) => {
    const selected = form.querySelector(`input[name="widerwayQ${i}"]:checked`);
    const answer = selected ? Number(selected.value) : -1;
    const correct = answer === question.c;

    if (correct) score++;

    corrections += `
      <div class="card">
        <h4>Question ${i + 1} — ${correct ? "Bonne réponse" : "À revoir"}</h4>
        <p><strong>Réponse attendue :</strong> ${question.a[question.c]}</p>
        <p>${question.e}</p>
      </div>
    `;
  });

  const percentage = score * 10;

  result.innerHTML = `
    <div class="card">
      <h2>Résultat : ${score}/10</h2>
      <p>Pourcentage de réussite : ${percentage}%</p>
      <p>${score >= 8 ? "Excellent travail !" : score >= 5 ? "Bon effort. Continue tes révisions !" : "Reprends les leçons et entraîne-toi encore."}</p>

    ) {
      moduleName = "Explication des cours";

    }
    else if (
      message.includes("qcm") ||
      message.includes("quiz") ||
      message.includes("examen")
    ) {
      moduleName = "Évaluation et examens";
      explanation = "Le module devra préparer des questions, proposer plusieurs réponses et fournir une correction expliquée.";
    }

    response.innerHTML = `
      <div class="panel">
        <h3>🎓 WiderAI Éducation</h3>
        <h4>${escapeHTML(moduleName)}</h4>
        <p>${escapeHTML(explanation)}</p>
        <p>Votre question a été orientée vers le bon module.</p>
        <p><small>Le moteur de génération pédagogique complet sera connecté progressivement.</small></p>

    `;

  // 4. Moteur de recherche scientifique
  response.innerHTML = "<p>🔎 WiderAI Recherche : recherche scientifique en cours...</p>";

 try {
